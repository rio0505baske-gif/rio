<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Todoアプリ</h1>

    <div class="input-area">
      <input type="text" id="todo-input" placeholder="タスクを入力..." maxlength="100">
      <button id="add-btn">追加</button>
    </div>

    <div class="filter-area">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了</button>
      <button class="filter-btn" data-filter="completed">完了</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="remaining-count">0件残っています</span>
      <button id="clear-completed">完了済みを削除</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
